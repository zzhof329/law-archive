<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="제철플랜트 신설·증축·합리화 건축 설계검토용 단계별 법규 체크리스트, 테마별 건축법 기준, 국가법령정보센터 현행 조문 링크와 개정 현황">
<meta name="theme-color" content="#24415f">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest"><title>건축설계 법규 아카이브</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 상단 고정 바 → 홈(소개·단계 카드·심의 기준표·최근 개정) / 단계 탭(체크리스트). 폰에서는 한 열. 청회색 강판 톤 + 주황 포인트 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#18202b; --sub:#566273; --line:#d7dde4;
  --steel:#24415f; --steel-ink:#ffffff; --accent:#c4561d; --accent-soft:#fbeee6; --link:#24415f;
  --ok:#1d7a4a; --okbg:#e3f3ea; --fix:#9a5b00; --fixbg:#fdf1dc; --na:#6c7480; --nabg:#eceff2;
  --new:#b4235a; --newbg:#fbe6ee; --cond:#4d3b8f; --condbg:#eeeaf8; --ty:#1b675a; --tybg:#e2f2ee;
  --f-display:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --surface2:#1f2833; --ink:#e4e9ef; --sub:#9aa6b4; --line:#2c3846;
  --steel:#1b3049; --steel-ink:#e8eef6; --accent:#e9874f; --accent-soft:#3a2416; --link:#9cc3ec;
  --ok:#5cc98c; --okbg:#173326; --fix:#e8a94a; --fixbg:#38290f; --na:#9aa3ad; --nabg:#252e38;
  --new:#f07aa6; --newbg:#3d1a29; --cond:#b7a6f0; --condbg:#2a2440; --ty:#6fd0bd; --tybg:#163430;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --surface2:#1f2833; --ink:#e4e9ef; --sub:#9aa6b4; --line:#2c3846;
  --steel:#1b3049; --steel-ink:#e8eef6; --accent:#e9874f; --accent-soft:#3a2416; --link:#9cc3ec;
  --ok:#5cc98c; --okbg:#173326; --fix:#e8a94a; --fixbg:#38290f; --na:#9aa3ad; --nabg:#252e38;
  --new:#f07aa6; --newbg:#3d1a29; --cond:#b7a6f0; --condbg:#2a2440; --ty:#6fd0bd; --tybg:#163430;
  color-scheme:dark }
*{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--steel)}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--steel);color:var(--steel-ink);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.proj{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.proj select{max-width:58vw;padding:5px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:var(--steel-ink)}
.proj select option{color:#18202b;background:#fff}
.tbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--steel-ink);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.12)}
.sync{font-size:12px;opacity:.85;white-space:nowrap;margin-left:auto}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa6b4;margin-right:5px;vertical-align:1px}
.sync.ok i{background:#5cc98c}.sync.busy i{background:#e8a94a}.sync.off i{background:#9aa6b4}
.search{display:flex;gap:6px;flex:1 1 260px;min-width:0}
.search input{flex:1;min-width:0;padding:6px 10px;border-radius:6px;border:0;background:#fff;color:#18202b}
.search a{display:inline-flex;align-items:center;padding:6px 12px;border-radius:6px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}

.tabs{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-top:14px;box-shadow:inset 0 -2px 0 var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,56px));z-index:4;background:var(--bg);padding-top:6px}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:820px){ .top{position:relative;top:auto} .tabs{top:env(safe-area-inset-top,0px);box-shadow:inset 0 -2px 0 var(--line),0 6px 8px -8px rgba(0,0,0,.25)} }
.tab{flex:0 0 auto;padding:9px 14px 8px;cursor:pointer;border:0;background:transparent;color:var(--sub);font-family:var(--f-display);font-weight:600;border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-weight:400;font-size:11.5px;margin-left:5px;color:var(--sub);font-variant-numeric:tabular-nums}

/* 홈 */
.hero{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:end}
.hero h1{margin:0;font-family:var(--f-display);font-size:clamp(24px,4.2vw,34px);line-height:1.25;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:8px 0 0;color:var(--sub);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:96px}
.fact b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--sub)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px;counter-reset:st}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.stage:hover{border-color:var(--steel)}
.stage .no{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.stage h3{margin:0;font-family:var(--f-display);font-size:17px}
.stage p{margin:0;font-size:13px;color:var(--sub);flex:1}
.stage .bar{margin-top:6px}
.stage .mini{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.sec{margin-top:28px}
.sec h2{margin:0 0 4px;font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.sec > p{margin:0 0 10px;color:var(--sub);font-size:13.5px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.news{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.news li{display:flex;gap:10px;align-items:baseline;padding:9px 12px;border-bottom:1px solid var(--line)}
.news li:last-child{border-bottom:0}
.news .dt{font-family:var(--f-mono);font-size:12.5px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.news a{flex:1;min-width:0;text-decoration:none;color:var(--ink)}
.news a:hover{text-decoration:underline}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.guide ol{margin:0;padding-left:20px;display:grid;gap:5px}

/* 체크리스트 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px}
.panel summary{cursor:pointer;font-family:var(--f-display);font-weight:600;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel summary::-webkit-details-marker{display:none}
.caret{transition:transform .15s;display:inline-block}
details[open] summary .caret{transform:rotate(90deg)}
.sumtxt{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--sub)}
.frow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px}
.flbl{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em;width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface);cursor:pointer;user-select:none;font-size:13px}
.chip input{margin:0;accent-color:var(--steel)}
.chip.on{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.shead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;margin-top:16px}
.shead h2{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:-.01em;text-wrap:balance}
.shead p{margin:2px 0 0;color:var(--sub);font-size:13.5px}
.prog{flex:0 1 260px;min-width:180px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.progtxt{font-size:12px;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tools input{flex:1 1 200px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;font-size:13.5px;color:var(--ink)}
.btn:hover{border-color:var(--steel)}
.btn.pri{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
.btn.danger{color:var(--new);border-color:var(--new)}
.btn.sm{padding:2px 8px;font-size:12px}
.cat{margin:22px 0 8px;font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.cat::after{content:"";flex:1;height:1px;background:var(--line)}
.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:8px;display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px}
.item.dim{opacity:.5}
.item.s-ok{border-left-color:var(--ok)}.item.s-fix{border-left-color:var(--fix)}.item.s-na{border-left-color:var(--na)}
.ttl{font-weight:700;font-size:15.5px}
.d{margin:3px 0 6px}
.p{background:var(--accent-soft);border-radius:6px;padding:5px 9px;font-size:13.5px}
.p b{color:var(--accent);font-size:12px;letter-spacing:.04em;margin-right:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.law{font-size:12.5px;border:1px solid var(--link);color:var(--link);border-radius:5px;padding:2px 8px;text-decoration:none;background:var(--surface)}
.law.ord{border-style:dashed}
.law:hover{background:var(--surface2)}
.tag{font-size:11.5px;border-radius:4px;padding:1px 6px;background:var(--nabg);color:var(--sub);white-space:nowrap}
.tag.cond{background:var(--condbg);color:var(--cond)}.tag.ty{background:var(--tybg);color:var(--ty)}
.tag.new{background:var(--newbg);color:var(--new);font-weight:700}.tag.soon{background:var(--fixbg);color:var(--fix);font-weight:700}
.tag.custom{background:var(--fixbg);color:var(--fix)}
.st{width:100%;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.st.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.st.fix{background:var(--fixbg);color:var(--fix);border-color:var(--fix)}
.st.na{background:var(--nabg);color:var(--na)}
.na-note{font-size:12px;color:var(--sub);margin-top:4px}
.memo{width:100%;margin-top:8px;border:1px dashed var(--line);border-radius:6px;padding:5px 9px;font-size:13.5px;resize:vertical;min-height:34px;background:var(--surface2)}
.memo:focus{border-style:solid;border-color:var(--steel);outline:none}
.empty{color:var(--sub);text-align:center;padding:30px 10px}
.tablewrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;font-size:13.5px}
tr:last-child td{border-bottom:0}
th{background:var(--surface2);font-size:12.5px;white-space:nowrap;color:var(--sub)}
th[data-sort]{cursor:pointer}
td.n{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.notice{background:var(--fixbg);color:var(--fix);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-top:10px}
.small{font-size:12.5px;color:var(--sub)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;z-index:20}
dialog{border:1px solid var(--line);border-radius:10px;padding:18px;width:min(560px,calc(100vw - 32px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,20,.45)}
dialog h3{margin:0 0 8px;font-family:var(--f-display)}
dialog label{display:block;margin:8px 0 3px;font-weight:700;font-size:13px}
dialog input,dialog select,dialog textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
footer{margin:34px 0 20px;color:var(--sub);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .facts{justify-content:flex-start}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .item{grid-template-columns:minmax(0,1fr);gap:8px}
  .sync{margin-left:0}
  .shead h2{font-size:18px}
}
@media (max-width:420px){ .flow{grid-template-columns:minmax(0,1fr)} }
.thchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.thchip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);cursor:pointer;font-size:13.5px;color:var(--ink)}
.thchip:hover{border-color:var(--steel)}
.thchip.on{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.theme{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:16px 18px;margin-top:14px}
.theme h2{margin:0;font-family:var(--f-display);font-size:21px}
.theme .lead{margin:6px 0 12px;color:var(--sub);max-width:70ch}
.rules{display:grid;grid-template-columns:150px minmax(0,1fr);gap:9px 16px;margin:0}
.rules dt{font-weight:700;color:var(--accent);font-size:14px}
.rules dd{margin:0;font-size:14.5px}
.thtable{min-width:420px}
@media (max-width:640px){ .rules{grid-template-columns:minmax(0,1fr);gap:2px} .rules dd{margin-bottom:8px} }.pflow{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:14px;counter-reset:ps}
.pstep{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--steel);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:4px}
.pstep.opt{border-top-color:var(--accent);border-style:dashed;border-top-style:solid}
.pstep.done{border-top-color:var(--ok)}
.pstep .pno{font-family:var(--f-mono);font-size:11.5px;color:var(--sub);letter-spacing:.04em}
.pstep b{font-family:var(--f-display);font-size:15.5px}
.pstep .ptime{align-self:flex-start;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 7px}
.pstep p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.ptable{min-width:620px}
.ptable td.nw{white-space:nowrap}
.ptable th{white-space:nowrap}
a.lawref{color:var(--link);text-decoration:underline;text-decoration-color:color-mix(in srgb, var(--link) 40%, transparent);text-underline-offset:2px}
a.lawref:hover{text-decoration-color:var(--link)}
@media (max-width:640px){
  .ptable{min-width:0}
  .ptable, .ptable tbody, .ptable tr, .ptable td{display:block;width:100%}
  .ptable tr:first-child{display:none}
  .ptable tr{border-bottom:1px solid var(--line);padding:9px 0}
  .ptable tr:last-child{border-bottom:0}
  .ptable td, .ptable td.nw{border:0;padding:2px 12px;white-space:normal}
  .ptable td::before{content:attr(data-label);display:inline-block;min-width:64px;margin-right:8px;font-size:12px;font-weight:700;color:var(--sub);vertical-align:top}
  .ptable td:first-child{font-weight:700;font-size:14.5px;padding-bottom:4px}
  .ptable td:first-child::before{display:none}
}
.psub{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,56px) + 52px);z-index:3}
@media (max-width:820px){ .psub{top:calc(env(safe-area-inset-top,0px) + 46px)} }
@media (max-width:640px){ .psub{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px 10px} .psub::-webkit-scrollbar{display:none} .pchip{flex:0 0 auto;padding:5px 11px;font-size:13px} }
.pchip{border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--surface2);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);font-family:var(--f-display)}
.pchip:hover{border-color:var(--steel)}
.pchip.on{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.pchip .cnt,.thchip .cnt{font-family:var(--f-mono);font-weight:400;font-size:11.5px;opacity:.75}
.ptips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ptip{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 13px}
.ptip b{font-family:var(--f-display);font-size:14.5px}
.ptip p{margin:4px 0;font-size:13.5px}@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

</head>
<body>
<div class="top"><div class="in">
  <button class="brand" data-tab="home">건축설계 법규 아카이브</button>
  <div class="proj">
    <select id="projSel" aria-label="프로젝트 선택"></select>
    <button class="tbtn" id="projNew">+ 새 프로젝트</button>
    <button class="tbtn" id="projMore">관리</button>
  </div>
  <div class="search">
    <input id="lawQ" placeholder="국가법령정보센터 검색 (예: 공장 내화구조)" aria-label="법령 검색어">
    <a id="lawGo" target="_blank" rel="noopener" href="https://www.law.go.kr/main.html">검색</a>
  </div>
  <div class="sync" id="sync"><i></i><span>연결 중</span></div>
</div></div>

<div class="wrap">
  <div class="tabs" id="tabs" role="tablist"></div>
  <details class="panel" id="condPanel" hidden>
    <summary><span class="caret">▸</span> 프로젝트 조건 <span class="sumtxt" id="condSum"></span></summary>
    <div class="frow"><span class="flbl">공사유형</span><span id="typeChips" class="frow" style="margin:0"></span></div>
    <div class="frow"><span class="flbl">해당 조건</span><span id="condChips" class="frow" style="margin:0"></span></div>
    <div class="frow"><label class="chip" id="onlyChip"><input type="checkbox" id="onlyApply"> 해당 항목만 보기</label></div>
  </details>
  <div id="view"></div>
  <footer>체크리스트의 조문번호·기준값은 요약입니다. 최종 판단은 📖 링크의 국가법령정보센터 현행 원문, 지자체 조례, 발주처 설계기준으로 확인하세요. 이 사이트는 참고용 자료이며 법적 효력이 없습니다.</footer>
</div>

<script src="data/items_extra.js"></script>
<script src="data/themes.js"></script>
<script src="data/manual.js"></script>
<script src="data/permit_items.js"></script>
<script src="data/permit.js"></script>
<script src="data/site.js"></script>
<script src="data/site2.js"></script>

<script>
(function(){
"use strict";
const LAW = "https://www.law.go.kr/";
const LKEY = "steelLawHelper.web.v1";
const TYPES = ["신설","증축","개축","합리화"];
const ST = [["","미확인"],["ok","확인완료"],["fix","보완필요"],["na","해당없음"]];
const STAGES = window.STAGES||[], CONDS = window.CONDITIONS||[], STATUS = window.LAW_STATUS||null, PATCH = window.LAW_PATCH||{};
const TABS = ["home"].concat(STAGES.map(s=>s.key), ["permit","theme","status","quick"]);
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash = s => { let h=5381; for (let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); };
const clone = o => JSON.parse(JSON.stringify(o||{}));
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)||"null"); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function merge(a,b){ const o = Object.assign({}, a); for (const k in b){ const v=b[k]; o[k] = (v && typeof v==="object" && !Array.isArray(v) && o[k] && typeof o[k]==="object" && !Array.isArray(o[k])) ? merge(o[k],v) : v; } return o; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true, 2400); }

/* ---------- 상태 ---------- */
const prefs = lsGet("steelLawHelper.prefs")||{};
let S = { projects:{}, custom:[] };   // 개인 데이터
let LIB = [];                          // 공용 추가 항목 (편집자만 수정)
let cur = prefs.cur||"", tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home", stageQ = "";
let db=null, uid=null, mode="loading", canEdit=false;
function savePrefs(){ lsSet("steelLawHelper.prefs", { cur }); }
const P = () => S.projects[cur];

/* ---------- 저장 계층 ---------- */
const queues = {};
function write(key, op, body){
  if (mode!=="cloud"){ lsSet(LKEY, S); return; }
  const q = queues[key] || (queues[key] = { busy:false, op:null, body:null });
  if (op==="update" && q.op && q.op!=="delete") q.body = merge(q.body, body);
  else { q.op = op; q.body = body; }
  flush(key);
}
async function flush(key){
  const q = queues[key]; if (q.busy || !q.op) return;
  q.busy = true; const op=q.op, body=q.body; q.op=null; q.body=null; setSync("busy");
  try {
    const ref = db.doc(key==="shared" ? "shared/library" : "data/users/"+uid+"/"+key);
    if (op==="delete") await ref.delete();
    else if (op==="set") await ref.set(body);
    else { try { await ref.update(body); } catch(e){ if (e && e.code==="invalid_argument") await ref.set(merge(fullDoc(key), body)); else throw e; } }
  } catch(e){
    if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r, 800+Math.random()*800)); if (!q.op){ q.op=op; q.body=body; } }
    else if (e && e.code==="invalid_argument" && key!=="shared"){ goLocal("보기 전용 권한 · 체크는 이 기기에만 저장"); }
    else { setSync("off", "저장 실패: "+(e&&e.message||e)); }
  }
  q.busy = false;
  if (q.op) flush(key); else if (mode==="cloud" && !Object.values(queues).some(x=>x.busy||x.op)) setSync("ok");
}
function fullDoc(key){ return key==="meta" ? { kind:"meta", custom:S.custom } : key==="shared" ? { items:LIB } : Object.assign({ kind:"project" }, clone(S.projects[key])); }
function setSync(s, msg){
  const el=$("#sync"); el.className="sync "+s;
  el.querySelector("span").textContent = msg || ({ok:"PC·휴대폰 동기화됨", busy:"저장 중…", off:"이 브라우저에 저장", loading:"연결 중"}[s]||"");
}
function goLocal(msg){ mode="local"; lsSet(LKEY,S); setSync("off", msg); }

async function boot(){
  const local = lsGet(LKEY);
  if (local && local.projects) S = local;
  ensureLocalProject(); render();
  if (!window.claude || !window.claude.use){ goLocal(); render(); return; }
  const timer = setTimeout(()=>{ if (mode==="loading") setSync("off","서버 응답 없음 · 이 기기에만 저장"); }, 10000);
  try {
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!d){ clearTimeout(timer); goLocal("로그인하면 PC·휴대폰 동기화"); render(); return; }
    db = d;
    if (u){ try { canEdit = !!(await u.canEdit()); } catch(e){} }
    db.doc("shared/library").onSnapshot(snap => { LIB = (snap.exists && (snap.data()||{}).items) || []; scheduleRender(); }, ()=>{});
    uid = u ? await u.id() : null;
    let writable = null; if (u){ try { writable = await u.can("data.write"); } catch(e){} }
    if (!uid || writable===false){ clearTimeout(timer); goLocal(uid ? "보기 전용 권한 · 체크는 이 기기에만 저장" : "로그인하면 PC·휴대폰 동기화"); render(); return; }
    db.collection("data/users/"+uid).onSnapshot(snap => {
      if (mode==="local" && db===null) return;
      const projects = {}; let custom = [];
      snap.docs.forEach(doc => { const v = doc.data()||{}; if (doc.id==="meta") custom = v.custom||[]; else if (v.kind==="project") projects[doc.id] = v; });
      const first = mode==="loading"; if (mode==="local") return;
      mode = "cloud"; S = { projects, custom };
      if (!snap.metadata.fromCache){ clearTimeout(timer); if (!Object.values(queues).some(x=>x.busy||x.op)) setSync("ok"); }
      if (first && !Object.keys(projects).length && !snap.metadata.fromCache){ createProject("기본 프로젝트"); return; }
      ensureCur(); scheduleRender();
    }, () => { clearTimeout(timer); setSync("off", "동기화 중단 · 새로고침 필요"); });
  } catch(e){ clearTimeout(timer); goLocal(); render(); }
}
function ensureLocalProject(){ if (!Object.keys(S.projects).length){ const id="p"+Date.now().toString(36); S.projects[id]=newProj("기본 프로젝트"); cur=id; } ensureCur(); }
function ensureCur(){ if (!S.projects[cur]){ const ks = Object.keys(S.projects).sort((a,b)=>(S.projects[a].created||0)-(S.projects[b].created||0)); cur = ks[0]||""; } }
function newProj(name){ return { kind:"project", name, type:"", conds:[], only:false, status:{}, created:Date.now() }; }
function createProject(name){ const id="p"+Date.now().toString(36); S.projects[id]=newProj(name); cur=id; savePrefs(); write(id,"set",clone(S.projects[id])); render(); }

let pending=false;
function scheduleRender(){ const a=document.activeElement; if (a && (a.classList.contains("memo")||a.id==="stageQ"||a.id==="lawQ")){ pending=true; return; } render(); }
document.addEventListener("focusout", ()=>{ if (pending){ setTimeout(()=>{ const a=document.activeElement; if (!(a&&a.classList&&(a.classList.contains("memo")||a.id==="stageQ"))) render(); },0); } });

/* ---------- 항목 ---------- */
function allItems(){
  return (window.LAW_ITEMS||[]).map(it => Object.assign({ id: hash(it.s+"|"+it.law+"|"+it.jo+"|"+it.t) }, it, PATCH[it.t]||{}))
    .concat(LIB.map(it => Object.assign({ shared:true }, it)), (S.custom||[]).map(it => Object.assign({ custom:true }, it)));
}
function lawUrl(name, jo, kind){ let u = LAW+encodeURIComponent(kind||"법령")+"/"+encodeURIComponent(name); if (jo && (!kind||kind==="법령")) u += "/"+encodeURIComponent(jo.replace(/\s/g,"")); return u; }
function applies(it,p){ if (!p) return true; if (p.type && it.ty && it.ty.length && !it.ty.includes(p.type)) return false; if (it.cd && it.cd.length && !it.cd.some(c=>(p.conds||[]).includes(c))) return false; return true; }
const today=new Date(), TODAY=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
const toDate = n => new Date(Math.floor(n/10000), Math.floor(n/100)%100-1, n%100);
const days = (a,b) => Math.round((toDate(b)-toDate(a))/86400000);
const fmt = y => y && String(y).length===8 ? String(y).slice(0,4)+"."+String(y).slice(4,6)+"."+String(y).slice(6) : (y||"-");
const info = n => STATUS && STATUS.laws ? STATUS.laws[n] : null;
function badges(n){
  const s=info(n); if (!s||!s.ok) return ""; let o=""; const ef=+s.efYd||0;
  if (s.changedOn && days(+s.changedOn.replace(/-/g,""), TODAY)<=30) o+=`<span class="tag new">개정감지</span>`;
  if (ef>TODAY) o+=`<span class="tag soon">시행예정 ${fmt(s.efYd)}</span>`;
  else if (ef && days(ef,TODAY)<=90) o+=`<span class="tag new">최근시행 ${fmt(s.efYd)}</span>`;
  return o;
}
const done = (p,id) => { const st=((p&&p.status||{})[id]||{}).st; return st==="ok"||st==="na"; };
function lawNames(){ const names=[]; allItems().forEach(it=>{ if(!names.includes(it.law)) names.push(it.law); }); (window.QUICK_LAWS||[]).forEach(n=>{ if(!names.includes(n)) names.push(n); }); return names; }

/* ---------- 렌더 ---------- */
function go(t){ tab=t; stageQ=""; try { history.replaceState(null,"", t==="home" ? location.pathname+location.search : "#"+t); } catch(e){ location.hash = t; } render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", ()=>{ const t=location.hash.slice(1)||"home"; if (TABS.includes(t) && t!==tab){ tab=t; render(); } });
function render(){
  pending=false; const p=P();
  $("#projSel").innerHTML = Object.entries(S.projects).sort((a,b)=>(a[1].created||0)-(b[1].created||0)).map(([id,x])=>`<option value="${id}" ${id===cur?"selected":""}>${esc(x.name)}</option>`).join("");
  const isStage = STAGES.some(s=>s.key===tab);
  $("#condPanel").hidden = !isStage;
  if (p){
    $("#typeChips").innerHTML = ["",...TYPES].map(t=>`<span class="chip ${(p.type||"")===t?"on":""}" data-type="${t}" role="button" tabindex="0">${t||"전체"}</span>`).join("");
    $("#condChips").innerHTML = CONDS.map(c=>`<label class="chip ${(p.conds||[]).includes(c.key)?"on":""}"><input type="checkbox" data-cond="${c.key}" ${(p.conds||[]).includes(c.key)?"checked":""}>${esc(c.label)}</label>`).join("");
    $("#onlyApply").checked=!!p.only; $("#onlyChip").classList.toggle("on",!!p.only);
    $("#condSum").textContent = `${p.type||"공사유형 전체"} · 조건 ${(p.conds||[]).length}개${p.only?" · 해당 항목만":""}`;
  }
  const items=allItems();
  $("#tabs").innerHTML = `<button class="tab ${tab==="home"?"on":""}" data-tab="home" role="tab">홈</button>` + STAGES.map(s=>{ const l=items.filter(it=>it.s===s.key&&applies(it,p)); return `<button class="tab ${tab===s.key?"on":""}" data-tab="${s.key}" role="tab">${s.label}<span class="cnt">${l.filter(it=>done(p,it.id)).length}/${l.length}</span></button>`; }).join("")
    + `<button class="tab ${tab==="permit"?"on":""}" data-tab="permit" role="tab">인허가</button><button class="tab ${tab==="theme"?"on":""}" data-tab="theme" role="tab">테마별 법규</button><button class="tab ${tab==="status"?"on":""}" data-tab="status" role="tab">개정 현황</button><button class="tab ${tab==="quick"?"on":""}" data-tab="quick" role="tab">바로가기·관리</button>`;
  if (tab==="home") renderHome(); else if (tab==="permit") renderPermit(); else if (tab==="theme") renderTheme(); else if (tab==="status") renderStatus(); else if (tab==="quick") renderQuick(); else renderStage();
}
function renderHome(){
  const p=P(), items=allItems();
  const recent = lawNames().map(n=>({n, s:info(n)})).filter(x=>x.s&&x.s.ok&&x.s.efYd).sort((a,b)=>b.s.efYd.localeCompare(a.s.efYd)).slice(0,8);
  const soon = lawNames().filter(n=>{ const s=info(n); return s&&+s.efYd>TODAY; }).length;
  const recentCnt = lawNames().filter(n=>{ const s=info(n); return s&&s.ok&&+s.efYd&&+s.efYd<=TODAY&&days(+s.efYd,TODAY)<=90; }).length;
  const RT = window.REVIEW_TABLE||[];
  $("#view").innerHTML = `
  <section class="hero">
    <div><h1>제철플랜트 건축 설계검토,<br><em>단계별로 놓치지 않게</em></h1>
    <p>공장 신설·증축·개축·합리화 때 계획부터 사용승인까지 확인할 법규를 모았습니다. 법령 링크는 항상 국가법령정보센터의 현행 조문으로 열리고, 체크와 메모는 사람마다 따로 저장됩니다.</p></div>
    <div class="facts">
      <div class="fact"><b>${items.length}</b><span>체크 항목</span></div>
      <div class="fact"><b>${lawNames().length}</b><span>관련 법령</span></div>
      <div class="fact"><b>${recentCnt}</b><span>최근 90일 시행</span></div>
      ${soon?`<div class="fact"><b>${soon}</b><span>시행 예정</span></div>`:""}
    </div>
  </section>
  <div class="flow">${STAGES.map((s,i)=>{ const l=items.filter(it=>it.s===s.key&&applies(it,p)), dn=l.filter(it=>done(p,it.id)).length, pct=l.length?Math.round(dn/l.length*100):0;
    return `<button class="stage" data-tab="${s.key}"><span class="no">STEP ${i+1}</span><h3>${esc(s.label)}</h3><p>${esc(s.desc)}</p><div class="bar"><i style="width:${pct}%"></i></div><span class="mini">${esc(p?p.name:"")} · ${dn}/${l.length} 처리</span></button>`; }).join("")}</div>

  <section class="sec"><h2>테마별 법규</h2><p>내화구조·방화구획처럼 건축법 주요 주제별로 핵심 기준과 관련 조문을 모았습니다.</p>
    <div class="thchips">${(window.THEMES||[]).map(x=>`<button class="thchip" data-th="${x.key}">${x.icon||""} ${esc(x.name)}</button>`).join("")}</div></section>
  <section class="sec"><h2>심의·평가 대상 한눈에</h2><p>일정에 큰 영향을 주는 심의·평가의 대상 규모와 시기입니다. 지자체 기준은 조례 개정 여부를 꼭 확인하세요.</p>
    <div class="tablewrap"><table class="ptable"><tr><th>구분</th><th>대상 기준</th><th>시기</th><th>근거</th></tr>
    ${RT.map(r=>`<tr><td data-label="구분"><b>${esc(r.name)}</b></td><td data-label="대상 기준">${esc(r.base)}</td><td data-label="시기" class="nw">${esc(r.when)}</td><td data-label="근거" class="small">${linkLaws(r.law)}</td></tr>`).join("")}</table></div></section>

  <section class="sec cols">
    <div><h2>최근 시행·개정 법령</h2><p>${STATUS?`${esc(STATUS.checkedAt)} 국가법령정보센터 기준`:"개정정보 없음"}</p>
      <ul class="news">${recent.map(x=>`<li><span class="dt">${fmt(x.s.efYd)}</span><a target="_blank" rel="noopener" href="${lawUrl(x.n)}">${esc(x.n)}</a>${+x.s.efYd>TODAY?`<span class="tag soon">예정</span>`:""}</li>`).join("")}</ul>
      <p class="small" style="margin-top:6px"><a href="#status" data-tab="status">전체 개정 현황 보기</a></p></div>
    <div><h2>이용 방법</h2><p>처음 오셨다면</p>
      <div class="guide"><ol>
        <li>상단 <b>+ 새 프로젝트</b>로 검토할 공사를 만듭니다.</li>
        <li>단계 탭에서 <b>프로젝트 조건</b>(공사유형, 위험물·고압가스·해체 등)을 고르면 해당 없는 항목이 흐려집니다.</li>
        <li>항목마다 상태(확인완료·보완필요·해당없음)와 검토 메모를 남깁니다. 내 체크는 나만 보입니다.</li>
        <li>📖 링크로 현행 조문을, 점선 링크로 지자체 조례를 엽니다.</li>
        <li>결과는 <b>CSV 저장</b>으로 엑셀에서 열 수 있습니다.</li>
      </ol></div></div>
  </section>`;
}
function renderStage(listOnly){
  const stage=STAGES.find(s=>s.key===tab)||STAGES[0]; const p=P(); const all=allItems().filter(it=>it.s===stage.key);
  const appl=all.filter(it=>applies(it,p)), dn=appl.filter(it=>done(p,it.id)).length, fx=appl.filter(it=>((p&&p.status||{})[it.id]||{}).st==="fix").length;
  const pct = appl.length?Math.round(dn/appl.length*100):0; const q=stageQ.trim().toLowerCase();
  let shown = all.filter(it=>!(p&&p.only)||applies(it,p));
  if (q) shown = shown.filter(it=>[it.t,it.d,it.p,it.law,it.jo,it.c].join(" ").toLowerCase().includes(q));
  const cats=[]; shown.forEach(it=>{ if(!cats.includes(it.c)) cats.push(it.c); });
  let h = `<div class="shead"><div><h2>${esc(stage.label)} 체크리스트</h2><p>${esc(stage.desc)}</p></div>
    <div class="prog"><div class="bar"><i style="width:${pct}%"></i></div><div class="progtxt">해당 ${appl.length}건 중 처리 ${dn}건 · ${pct}%${fx?` · <b style="color:var(--fix)">보완필요 ${fx}</b>`:""}</div></div></div>
    <div class="tools"><input id="stageQ" placeholder="이 단계에서 검색" value="${esc(stageQ)}" aria-label="단계 내 검색"><button class="btn" data-act="add">+ 항목 추가</button><button class="btn" data-act="csv">CSV 저장</button></div>`;
  let L = "";
  if (!shown.length) L += `<div class="empty">표시할 항목이 없습니다.</div>`;
  cats.forEach(c=>{ L+=`<div class="cat">${esc(c)}</div>`; shown.filter(it=>it.c===c).forEach(it=>L+=itemHtml(it,p)); });
  const box = $("#stageList");
  if (listOnly && box) { box.innerHTML = L; return; }
  $("#view").innerHTML = h + `<div id="stageList">${L}</div>`;
}
function itemHtml(it,p){
  const r=((p&&p.status)||{})[it.id]||{}, st=r.st||"", ok=applies(it,p), s=info(it.law);

function linkLaws(s){

    <label>확인 내용</label><textarea name="d" rows="2">${esc(it?it.d:"")}</textarea>
    <label>제철플랜트 적용 포인트</label><textarea name="p" rows="2">${esc(it?it.p:"")}</textarea>${acts("저장")}`, fd => {
      const v={}; ["s","c","law","jo","t","d","p"].forEach(k=>v[k]=String(fd.get(k)||"").trim()); if(!v.law||!v.t) return; v.c=v.c||"기타";
      if (shared){ LIB = it ? LIB.map(x=>x.id===it.id?Object.assign({id:it.id},v):x) : LIB.concat([Object.assign({id:"s"+Date.now().toString(36)},v)]); saveLib(); }
      else { S.custom = it ? S.custom.map(x=>x.id===it.id?Object.assign({id:it.id},v):x) : S.custom.concat([Object.assign({id:"c"+Date.now().toString(36)},v)]); saveMine(); }
      render(); toast("저장했습니다");
    });
}

/* ---------- 파일 ---------- */
const stamp = () => { const d=new Date(); return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); };
function saveFile(name, data){
  try { const b = new Blob([data], {type: name.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/json"}); const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800); toast("저장했습니다"); }
  catch(e){ toast("저장하지 못했습니다"); }
}
function csv(stages){
  const p=P(); const cell=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const rows=[["단계","분야","항목","법령","조문","확인내용","플랜트 포인트","해당여부","상태","메모","현행 시행일","링크"]];
  allItems().filter(it=>stages.includes(it.s)).forEach(it=>{ const r=((p&&p.status)||{})[it.id]||{}, s=info(it.law)||{};
    rows.push([(STAGES.find(x=>x.key===it.s)||{}).label,it.c,it.t,it.law,it.jo||"",it.d||"",it.p||"",applies(it,p)?"해당":"해당없음(조건)",(ST.find(x=>x[0]===(r.st||""))||[])[1],r.memo||"",fmt(s.efYd),lawUrl(it.law,it.jo,it.kind)]); });
  saveFile(`${stamp()}_법규체크리스트_${p?p.name:""}.csv`, "﻿"+rows.map(r=>r.map(cell).join(",")).join("\r\n"));
}
function importBackup(d){
  const ps = d && d.projects; if (!ps) { toast("백업 파일 형식이 아닙니다"); return; }
  dialog(`<h3>백업 불러오기</h3><p>프로젝트 ${Object.keys(ps).length}개(${esc(Object.values(ps).map(x=>x.name).join(", "))})와 내 항목 ${(d.custom||[]).length}개를 가져옵니다. 같은 프로젝트가 있으면 백업 내용으로 바뀝니다.</p>${acts("가져오기")}`, () => {
    Object.entries(ps).forEach(([id,x])=>{ const pr = { kind:"project", name:x.name||"가져온 프로젝트", type:x.type||"", conds:x.conds||[], only:!!x.only, status:x.status||{}, created:x.created||Date.now() }; S.projects[id]=pr; write(id,"set",clone(pr)); });
    const ids = new Set(S.custom.map(c=>c.id)); (d.custom||[]).forEach(c=>{ if(!ids.has(c.id)) S.custom.push(c); });
    saveMine(); cur=Object.keys(ps)[0]; savePrefs(); render(); toast("가져왔습니다");
  });
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", e=>{
  const t=e.target;
  const psb=t.closest("[data-psec]"); if (psb){ permitSec=psb.dataset.psec; permitGrp=""; renderPermit(); const nav=document.querySelector(".psub"); if (nav && window.scrollY > nav.offsetTop) window.scrollTo(0, Math.max(0, nav.offsetTop-120)); return; }
  const pgb=t.closest("[data-pgrp]"); if (pgb){ permitGrp=pgb.dataset.pgrp; renderPermit(); return; }
  const thb=t.closest("[data-th]"); if (thb){ themeKey=thb.dataset.th; if (tab!=="theme") go("theme"); else { renderTheme(); } return; }
  const tb=t.closest("[data-tab]"); if (tb){ e.preventDefault(); go(tb.dataset.tab); return; }
  const ty=t.closest("[data-type]"); if (ty&&P()){ P().type=ty.dataset.type; write(cur,"update",{type:P().type}); render(); return; }
  const so=t.closest("[data-sort]"); if (so){ const k=so.dataset.sort; if (sortKey===k) sortDesc=!sortDesc; else { sortKey=k; sortDesc=k!=="n"; } renderStatus(); return; }
  if (t.dataset.edit){ const id=t.dataset.edit; itemDialog(allItems().find(x=>x.id===id)); return; }
  if (t.dataset.delc){ const id=t.dataset.delc, it=allItems().find(x=>x.id===id); dialog(`<h3>항목 삭제</h3><p>'${esc(it&&it.t)}' 항목을 삭제합니다.${it&&it.shared?" 공용 항목이라 모든 사람에게서 사라집니다.":""}</p>${acts("삭제")}`, ()=>{ if (it.shared){ LIB=LIB.filter(x=>x.id!==id); saveLib(); } else { S.custom=S.custom.filter(x=>x.id!==id); saveMine(); } render(); }); return; }
  const a=t.dataset.act;
  if (a==="add") itemDialog(null); else if (a==="csv") csv([tab]); else if (a==="csvAll") csv(STAGES.map(s=>s.key));
  else if (a==="backup") saveFile(`${stamp()}_법규아카이브_백업.json`, JSON.stringify({ projects:S.projects, custom:S.custom }, null, 1));
});
document.addEventListener("keydown", e=>{ if ((e.key==="Enter"||e.key===" ") && e.target.dataset && e.target.dataset.type!==undefined){ e.preventDefault(); e.target.click(); } });
document.addEventListener("change", e=>{
  const t=e.target, p=P();
  if (t.dataset.cond && p){ const k=t.dataset.cond; p.conds = t.checked?[...new Set([...(p.conds||[]),k])]:(p.conds||[]).filter(c=>c!==k); write(cur,"update",{conds:p.conds}); render(); }
  else if (t.id==="onlyApply" && p){ p.only=t.checked; write(cur,"update",{only:p.only}); render(); }
  else if (t.dataset.st && p){ const id=t.dataset.st, at=new Date().toISOString().slice(0,10); p.status=p.status||{}; p.status[id]=Object.assign({},p.status[id],{st:t.value,at}); write(cur,"update",{status:{[id]:{st:t.value,at}}}); render(); }
  else if (t.id==="projSel"){ cur=t.value; savePrefs(); render(); }
  else if (t.id==="restoreFile" && t.files[0]){ const r=new FileReader(); r.onload=()=>{ try { importBackup(JSON.parse(r.result)); } catch(err){ toast("백업 파일을 읽지 못했습니다"); } }; r.readAsText(t.files[0],"utf-8"); t.value=""; }
});
function applyStageQ(t){ if (stageQ===t.value) return; stageQ=t.value; renderStage(true); }
document.addEventListener("compositionend", e=>{ if (e.target && e.target.id==="stageQ") applyStageQ(e.target); });
const memoTimers={};
document.addEventListener("input", e=>{
  const t=e.target, p=P();
  if (t.dataset.memo && p){ const id=t.dataset.memo; p.status=p.status||{}; p.status[id]=Object.assign({},p.status[id],{memo:t.value}); clearTimeout(memoTimers[id]); memoTimers[id]=setTimeout(()=>write(cur,"update",{status:{[id]:{memo:t.value}}}),700); }
  else if (t.id==="stageQ"){ applyStageQ(t); }
  else if (t.id==="lawQ"){ const q=t.value.trim(); $("#lawGo").href = q ? `${LAW}lsSc.do?menuId=1&subMenuId=15&tabMenuId=81&query=${encodeURIComponent(q)}` : "https://www.law.go.kr/main.html"; }
});
$("#lawQ").addEventListener("keydown", e=>{ if (e.key==="Enter"){ e.preventDefault(); $("#lawGo").click(); } });
$("#projNew").onclick = () => dialog(`<h3>새 프로젝트</h3><label>프로젝트 이름</label><input name="n" required placeholder="예: 2제강 연주설비 합리화">${acts("만들기")}`, fd=>{ const n=String(fd.get("n")||"").trim(); if(n) createProject(n); });
$("#projMore").onclick = () => { const p=P(); if(!p) return; dialog(`<h3>프로젝트 관리</h3><label>이름</label><input name="n" value="${esc(p.name)}">
  <label style="margin-top:14px;font-weight:400"><input type="checkbox" name="del" style="width:auto"> 이 프로젝트 삭제 (체크 상태·메모 모두 삭제, 되돌릴 수 없음)</label>${acts("적용")}`, fd=>{
    if (fd.get("del")){ if (Object.keys(S.projects).length<=1){ toast("프로젝트가 하나뿐이라 삭제할 수 없습니다"); return; } delete S.projects[cur]; write(cur,"delete"); ensureCur(); savePrefs(); render(); toast("삭제했습니다"); return; }
    const n=String(fd.get("n")||"").trim(); if (n && n!==p.name){ p.name=n; write(cur,"update",{name:n}); render(); }
  }); };
if (window.innerWidth>640) $("#condPanel").open = true;
function setTopH(){ const t=document.querySelector(".top"); if (t) document.documentElement.style.setProperty("--topH", t.offsetHeight+"px"); }
window.addEventListener("resize", setTopH); setTopH();
setSync("loading");
boot();
})();
</script>

</body>
